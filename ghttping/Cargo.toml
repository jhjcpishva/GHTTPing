[package]
name = "ghttping"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.29.0", features = ["crossterm"], default-features = false }
crossterm = "0.28.1"
clap = { version = "4.5.27", features = ["derive"] }
tokio = { version = "1.37.0", features = ["full"] }
reqwest = { version = "0.12.20", features = ["rustls-tls"] }
